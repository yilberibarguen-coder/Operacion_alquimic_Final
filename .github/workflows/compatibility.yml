name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Verify on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Check packaged API in English
        shell: bash
        run: java scripts/VerifyJar.java target/alquimia-savitar-1.0.0.jar
      - name: Check packaged API with Turkish locale regression
        shell: bash
        run: java scripts/VerifyJar.java target/alquimia-savitar-1.0.0.jar tr TR
